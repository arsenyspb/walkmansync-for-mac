name: "Feature Request"
description: "Suggest a feature, new Walkman device support, or improvement"
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ### Suggest an enhancement for WalkmanSync
        Share your idea for a new feature, hardware support, or workflow improvement.

  - type: input
    id: feature_title
    attributes:
      label: Feature Summary
      description: Brief one-line summary of the feature.
      placeholder: "e.g. Add support for Sony NW-MS70D MagicGate MemoryStick transfer"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem or limitation is.
      placeholder: "I'm always frustrated when..."
    validations:
      required: false

  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
      placeholder: "WalkmanSync should..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Additional context or hardware details
      description: Add any other context, device models, or screenshots.
      placeholder: "Hardware VID/PID, OMGAUDIO structure notes, etc."
    validations:
      required: false
