name: CI & Build Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run Test Suite
        run: make test

      - name: Build WalkmanSync
        run: make build

      - name: Archive Application Bundle
        run: |
          cd WalkmanSync
          zip -r WalkmanSync.app.zip WalkmanSync.app

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WalkmanSync.app
          path: WalkmanSync/WalkmanSync.app.zip
