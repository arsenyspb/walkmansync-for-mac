name: CI & Automated Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Test Suite
        run: make test

      - name: Build Application & Package DMG
        run: make dmg

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WalkmanSync.dmg
          path: WalkmanSync/WalkmanSync.dmg

      - name: Auto-Release on Git Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: WalkmanSync/WalkmanSync.dmg
          generate_release_notes: true
